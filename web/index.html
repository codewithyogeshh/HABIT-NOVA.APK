<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="HabitNova - AI-Powered Habit Tracker & Daily Routine Builder">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="HabitNova">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>HabitNova - Smart Habit Tracker</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    window.synveroRequestNotificationPermission = async function() {
      if (!("Notification" in window)) {
        return "unsupported";
      }
      try {
        const permission = await Notification.requestPermission();
        return permission;
      } catch (e) {
        return "denied";
      }
    };

    window.synveroGetNotificationPermission = function() {
      if (!("Notification" in window)) {
        return "unsupported";
      }
      return Notification.permission;
    };

    window.synveroShowNotification = function(title, body) {
      if (!("Notification" in window)) return false;
      if (Notification.permission === "granted") {
        try {
          new Notification(title, {
            body: body,
            icon: "favicon.png"
          });
          return true;
        } catch (e) {
          return false;
        }
      }
      return false;
    };

    window.synveroFocusAudio = null;

    window.synveroPlayFocusSound = function(soundType, volume) {
      try {
        if (window.synveroFocusAudio) {
          window.synveroFocusAudio.pause();
          window.synveroFocusAudio.currentTime = 0;
          window.synveroFocusAudio = null;
        }
        const audioSrc = 'assets/assets/audio/focus_' + soundType + '.mp3';
        const audio = new Audio(audioSrc);
        audio.loop = true;
        audio.volume = Math.max(0, Math.min(1, volume != null ? volume : 0.8));
        audio.play().catch(function() {
          const fallback = new Audio('assets/audio/focus_' + soundType + '.mp3');
          fallback.loop = true;
          fallback.volume = Math.max(0, Math.min(1, volume != null ? volume : 0.8));
          fallback.play().catch(function(err) {
            console.warn('Audio play restricted:', err);
          });
          window.synveroFocusAudio = fallback;
        });
        window.synveroFocusAudio = audio;
        return true;
      } catch (e) {
        console.error('Focus audio error:', e);
        return false;
      }
    };

    window.synveroStopFocusSound = function() {
      try {
        if (window.synveroFocusAudio) {
          window.synveroFocusAudio.pause();
          window.synveroFocusAudio.currentTime = 0;
          window.synveroFocusAudio = null;
        }
        return true;
      } catch (e) {
        return false;
      }
    };

    window.synveroSetFocusVolume = function(volume) {
      try {
        if (window.synveroFocusAudio) {
          window.synveroFocusAudio.volume = Math.max(0, Math.min(1, volume));
        }
        return true;
      } catch (e) {
        return false;
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
